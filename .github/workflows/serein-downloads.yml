name: Serein Downloads APK
on:
  workflow_dispatch:
  push:
    branches: [serein-downloads]
    paths: ['android/serein-downloads/**', '.github/workflows/serein-downloads.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash android/serein-downloads/run-tests.sh
      - run: bash android/serein-downloads/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Serein-Downloads-test-signature
          path: android/serein-downloads/app/build/manual/Serein-Downloads-0.1.apk
